<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RateGate Admin Panel (Vanilla JS)</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">RG</div>
      <div>
        <div class="title">RateGate Admin</div>
        <div class="subtitle">Plain HTML + CSS + JavaScript (no frameworks)</div>
      </div>
    </div>

    <div class="topbar-right">
      <button id="btnPing" class="btn">Ping /health</button>
      <button id="btnDbPing" class="btn">Ping /health/db</button>
    </div>
  </header>

  <div class="layout">
   
    <main class="content">
      <section class="status">
        <div id="statusLine" class="status-line muted">Ready.</div>
      </section>

      <section id="page-check" class="page"></section>
    </main>
  </div>

  <footer class="footer">
    <div class="small muted">
      RateGate Admin Panel — built for teaching and interviews. No frameworks. No build step.
    </div>
  </footer>

  <script src="admin.js" defer></script>
</body>
</html>
